[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
# The shipped binary keeps its name — the auto-updater and the release
# zips expect `baucord` / `baucord.exe`.
name = "baucord"
path = "src/main.rs"

[features]
default = []
# System tray via Slint's builtin SystemTrayIcon (1.17+; native
# Shell_NotifyIconW / AppKit / StatusNotifier backends — the Linux one
# speaks the StatusNotifier D-Bus protocol directly, no
# libappindicator system packages). Closing the window then hides to
# the tray instead of quitting. Enable it in the release workflow:
# `--features tray`.
tray = ["frontend/tray"]
[dependencies]
frontend = { path = "../frontend" }
client = { path = "../client" }
slint.workspace = true
log.workspace = true
env_logger.workspace = true

[build-dependencies]
winresource = "0.1"
