[package]
name = "desktop"
version = "0.2.5"
edition = "2024"

[lints]
workspace = true

[[bin]]
# The shipped binary keeps its name — the auto-updater and the release
# zips expect `baucord` / `baucord.exe`.
name = "baucord"
path = "src/main.rs"

[features]
default = []
# System tray via Slint's builtin SystemTrayIcon (1.17+; native
# Shell_NotifyIconW / AppKit / StatusNotifier backends — the Linux one
# speaks the StatusNotifier D-Bus protocol directly, no
# libappindicator system packages). Closing the window then hides to
# the tray instead of quitting. Enable it in the release workflow:
# `--features tray`.
tray = ["slint/system-tray"]
[dependencies]
client = { path = "../client" }
i18n = { path = "../i18n" }
audio = { path = "../audio", features = ["serde"] }
video = { path = "../video" }
app-core = { path = "../app-core" }
ui = { path = "../ui" }
slint.workspace = true
# Raw winit window events: the OS invalidates window surfaces on
# focus/reveal transitions that Slint's damage tracking can't see;
# app.rs::repaint_on_reveal hooks them. Default features are empty —
# this only pulls the accessor trait; cargo unifies the version with
# slint's own internal dependency.
i-slint-backend-winit = "1.17"
renet.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger = "0.11"
chrono = "0.4.41"
ureq = "3.2.0"
open = "5.3.3"
global-hotkey = "0.7"
# png/gif are the wire formats; the rest let attach/paste/drop decode
# the common disk formats (re-encoded to PNG before sending). 0.25.9
# floor guarantees the root ImageReader/Limits API used for bounded
# decoding.
image = { version = "0.25.9", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico", # decodes assets/icons/icon.ico for the tray (feature `tray`)
] }
# Own-process CPU/memory for the sidebar stats line. Only the `system`
# feature — no disks/network/components/users — to keep the build lean.
# SANDBOX-PIN(0.38): the 0.39 line needs rustc ≥1.92 (cfg_select) and this
# sandbox validates on 1.91. The API used (refresh_processes_specifics +
# ProcessesToUpdate + ProcessRefreshKind) is identical across 0.38/0.39.
# Restore to `0.39` in the real workspace — MIGRATION.md tracks this.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
zip = "2"
self-replace = "1.5.0"
# Plain-text clipboard read/write. Slint exposes no clipboard API;
# TextInput's internal Ctrl+V only covers text typed into it — the
# rich-paste chain and "Copy message" need programmatic access.
# clipboard.rs keeps its per-platform file/PNG readers (arboard has
# no file-list support).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Native open/save dialogs (FLTK's chooser is gone). The portal backend
# avoids a GTK link dependency; it is async, hence the tiny pollster
# block_on on the dialog scratch threads.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Native NSPasteboard access for what the toolkit clipboard layer can't
# see: copied files (paste the file, not its icon) and PNG-only
# sources like screenshot copies. Only the NSPasteboard header —
# default features would compile every AppKit binding.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSPasteboard",
] }

[build-dependencies]
winresource = "0.1"
