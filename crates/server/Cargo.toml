[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
protocol = { path = "../protocol" }
transport = { path = "../transport", features = ["server"] }
serde = { version = "1.0", features = ["derive"] }
chrono.workspace = true
log = "0.4"
env_logger.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
serde_yaml = "0.9.34"
# SHA-256 for chat-image content hashes and client-key user ids.
thiserror.workspace = true
crossbeam-channel.workspace = true
# Invite codes (spec §3.1).
rand.workspace = true
# The persistence store (spec §1). `bundled` compiles SQLite in (no
# system library on any platform; `cc` handles MSVC); `backup` is the
# online backup API behind `server backup`.
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
# `server backup` archives the database snapshot and the blobs directory.
tar = "0.4.46"

[dev-dependencies]
transport = { path = "../transport", features = ["sim"] }
