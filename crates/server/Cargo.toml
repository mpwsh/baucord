[package]
name = "server"
version = "1.0.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
protocol = { path = "../protocol" }
transport = { path = "../transport" }
bytes.workspace = true
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
serde_yaml = "0.9.34"
# Constant-time comparison for the shared password.
subtle = "2.6"
# SHA-256 for chat-image content hashes and client-key user ids.
sha2 = "0.11"

[dev-dependencies]
transport = { path = "../transport", features = ["sim"] }
