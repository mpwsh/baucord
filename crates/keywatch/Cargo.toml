[package]
name = "keywatch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Watches the keys a keybind names without taking them from other programs"

[lints]
workspace = true

[dependencies]
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust, and already in the tree (arboard, global-hotkey, winit).
# `xinput` for the raw key events the watcher sleeps on.
x11rb = { version = "0.13", features = ["xinput"] }
# `poll` on the X11 socket and the stop pipe.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
