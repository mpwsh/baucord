[package]
name = "client"
version = "0.4.7"
edition = "2024"

[lints]
workspace = true

[dependencies]
audio = { path = "../audio", features = ["serde"] }
protocol = { path = "../protocol" }
video = { path = "../video" }
serde.workspace = true
serde_json = "1.0"
renet.workspace = true
renet_netcode = "2.0"
socket2 = "0.6"
log.workspace = true
crossbeam-channel.workspace = true
# Connect-token fetch over HTTPS (TLS terminated by the deployment's
# reverse proxy; ureq's default rustls handles the client side).
ureq = "2"
# Per-platform config directory for settings.json.
dirs = "6"
