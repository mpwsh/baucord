[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
audio = { path = "../audio" }
protocol = { path = "../protocol" }
transport = { path = "../transport" }
video = { path = "../video" }
serde.workspace = true
serde_json.workspace = true
# Content hash of relayed images.
log.workspace = true
crossbeam-channel.workspace = true
# Per-platform config directory for settings.json and the identity key.
dirs = "6"

[dev-dependencies]
# The integration tests run a real server driver against the client's
# network thread; the client itself never builds the server side.
transport = { path = "../transport", features = ["server"] }
