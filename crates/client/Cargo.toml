[package]
name = "client"
version = "0.1.12"
edition = "2024"

[dependencies]
audio = { path = "../audio", features = ["serde"] }
ui = { path = "../ui" }
protocol = { path = "../protocol" }
video = { path = "../video" }
fltk = { version = "1.5", features = ["fltk-bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
chrono = "0.4.41"
renet = "1.2.0"
renet_netcode = "1.2.0"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5.15"
ureq = "3.2.0"
open = "5.3.3"
global-hotkey = "0.7"
trayicon = { git = "https://github.com/mpwsh/trayicon-rs" }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"
