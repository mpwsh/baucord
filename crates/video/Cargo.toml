[package]
name = "video"
version = "0.4.4"
edition = "2021"

[lints]
workspace = true

[dependencies]
log.workspace = true
thiserror = "2"

# Desktop-only backends. iOS/Android builds get stub implementations
# whose constructors fail cleanly (see src/capture.rs, src/codec_stub.rs);
# the pure types, traits and jitter buffer compile on every target.
# Vendored DXGI capture (src/dxgi.rs). Same windows-crate version as
# xcap so the two coexist without duplicate windows-sys trees.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
#xcap = { git = "https://github.com/nashaofu/xcap" }
xcap = "0.9.8"
# Windows static: vcpkg install ffmpeg[x264,gpl]:x64-windows-static-md
#                 set VCPKG_ROOT=C:\path\to\vcpkg
# Linux:          apt install libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
# macOS:          brew install ffmpeg
ffmpeg-next = "8"

[dev-dependencies]
env_logger = "0.11"
