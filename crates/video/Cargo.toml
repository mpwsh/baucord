[package]
name = "video"
version = "0.4.8"
edition = "2021"

[lints]
workspace = true

[dependencies]
log.workspace = true
thiserror = "2"

# Desktop-only backends. iOS/Android builds get stub implementations
# whose constructors fail cleanly (see src/capture.rs, src/codec_stub.rs);
# the pure types, traits and jitter buffer compile on every target.
# Vendored DXGI capture (src/dxgi.rs). Same windows-crate version as
# xcap so the two coexist without duplicate windows-sys trees.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
] }

# Android decodes through the platform's MediaCodec (src/mediacodec.rs,
# ANDROID-SPEC.md D23): `media` is the AMediaCodec/AMediaFormat
# binding (links libmediandk), `api-level-29` (= minSdk) unlocks the
# per-buffer format and crop-rect accessors it uses. Defaults off: the
# raw-window-handle glue is the Slint backend's business.
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["media", "api-level-29"] }

# iOS decodes through VideoToolbox (src/videotoolbox.rs, IOS-SPEC.md D9):
# the objc2 framework bindings, 0.3 like the rest of the tree (cpal and
# Slint's iOS backend already bring objc2-core-foundation and
# objc2-core-video; objc2-core-media and objc2-video-toolbox are new).
# Default features off: only what the decoder calls.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
  "std",
  "CMBase",
  "CMBlockBuffer",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMTime",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = [
  "std",
  "VTBase",
  "VTErrors",
  "VTSession",
  "VTDecompressionProperties",
  "VTDecompressionSession",
  "objc2-core-media",
  "objc2-core-video",
] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
#xcap = { git = "https://github.com/nashaofu/xcap" }
xcap = "0.9.8"
# Windows static — vcpkg PINNED to 34823ada10080ddca99b60e85f80f55e18a44eea
# (ffmpeg 7.1.2, the newest port ffmpeg-next 8.1 reliably builds against;
# vcpkg HEAD ships FFmpeg 9.x which does not compile — see the CI workflow):
#   git -C %VCPKG_ROOT% checkout 34823ada10080ddca99b60e85f80f55e18a44eea
#   vcpkg install ffmpeg[x264,gpl,nvcodec,amf]:x64-windows-static-md --recurse
#   set VCPKG_ROOT=C:\path\to\vcpkg   (ONE instance — mismatched
#   VCPKG_ROOT silently links a different install)
# Linux:          apt install libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
# macOS:          brew install ffmpeg
# The default feature set minus `device`: baucord captures with xcap,
# not libavdevice, and libavdevice is where every capture-device
# dependency lives — avfoundation on macOS (a hard reference to a
# macOS-14 symbol crashed 1.1.5 on Ventura), x11grab/xcbgrab (which
# linked Homebrew's X11 into the same binary), dshow/Media Foundation
# on Windows. Not linking it is what makes the release static for real.
ffmpeg-next = { version = "8", default-features = false, features = [
  "codec",
  "filter",
  "format",
  "software-resampling",
  "software-scaling",
] }

[dev-dependencies]
env_logger = "0.11"
