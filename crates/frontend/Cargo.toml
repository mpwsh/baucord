[package]
name = "frontend"
# The client's UI logic: everything between the `client` crate and the
# Slint windows, shared by every host (desktop today, Android next —
# ANDROID-SPEC.md §5). Extracted from the desktop crate in 1.1.6 with
# no behaviour change; the host-specific modules (tray, hotkeys,
# clipboard, single instance, updater, share windows) still live here
# behind the `desktop` feature until the platform trait replaces them.
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["desktop"]
# Everything a desktop host has and a phone does not: raw winit window
# events (repaint-on-reveal, OS file drops, raise/centre), the system
# clipboard, global hotkeys and key polling, the single-instance
# socket, the auto-updater, native file dialogs and the system URL
# launcher. Without it every host module compiles to its `stubs/`
# twin and `cargo check -p frontend --no-default-features` is what
# Android starts from (ANDROID-SPEC.md §5).
desktop = [
  # Raw winit window events and the window handle: the OS invalidates
  # window surfaces on focus/reveal transitions that Slint's damage
  # tracking can't see (app.rs::repaint_on_reveal hooks them), and
  # winit sees files dropped from the OS. Through Slint's own feature;
  # it used to be a direct dependency on Slint's internal backend
  # crate (review P3-50).
  "slint/unstable-winit-030",
  "dep:arboard",
  "dep:global-hotkey",
  "dep:keywatch",
  "dep:interprocess",
  "dep:zip",
  "dep:self-replace",
  "dep:rfd",
  "dep:pollster",
  "dep:open",
  "dep:objc2-app-kit",
  # HTTP: the updater, and a pasted image URL — and a phone has no
  # clipboard to paste one from.
  "dep:ureq",
]
# System tray via Slint's builtin SystemTrayIcon (1.17+). Closing the
# window then hides to the tray instead of quitting. Enable it in the
# release workflow: `--features tray`.
tray = ["slint/system-tray"]

[dependencies]
client = { path = "../client" }
# Fingerprint parsing for the settings editor and the identity key type.
transport = { path = "../transport" }
i18n = { path = "../i18n" }
audio = { path = "../audio" }
video = { path = "../video" }
app-core = { path = "../app-core" }
ui = { path = "../ui" }
# Settings → Open-source licenses reads licenses.json.
serde.workspace = true
serde_json.workspace = true
slint.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
chrono.workspace = true
ureq = { version = "3.4", optional = true }
open = { version = "5.4", optional = true }
global-hotkey = { version = "0.8", optional = true }
# Keybinds watch the key state instead of registering a global hotkey,
# so the key still types everywhere else (hotkeys.rs).
keywatch = { path = "../keywatch", optional = true }
# One instance per config directory: a second launch knocks on the
# first one's local socket (named pipe / abstract socket / /tmp file)
# and the first raises its window. See instance.rs.
interprocess = { version = "2.4", optional = true }
# The Downloads folder, for file cards' Save (spec §7).
dirs = "6"
# Deflate only, which is all a release zip uses: the default features
# add AES, bzip2, lzma, ppmd, xz and C zstd for archives the updater
# never opens. (`deflate-flate2` alone names no backend.)
zip = { version = "8.6", optional = true, default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }
self-replace = { version = "1.5", optional = true }
# Plain-text clipboard read/write. Slint exposes no clipboard API;
# TextInput's internal Ctrl+V only covers text typed into it — the
# rich-paste chain and "Copy message" need programmatic access.
# clipboard.rs keeps its per-platform file/PNG readers (arboard has
# no file-list support).
arboard = { version = "3", default-features = false, optional = true, features = [
  "wayland-data-control",
  "image-data",     # set_image for "Copy image"
] }
# Native open/save dialogs. The portal backend avoids a GTK link
# dependency; it is async, hence the tiny pollster block_on on the
# dialog scratch threads. (rfd 0.17 has no async-runtime feature to
# choose. Earlier versions did, and it had to be async-std: with
# `tokio`, the zbus the tray shares panicked at startup.)
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"], optional = true }
pollster = { version = "0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `setxattr` for the quarantine flag on a saved download (review
# 2026-10, P1-9); already in the tree through std's own dependents.
libc = "0.2"
# Native NSPasteboard access for what the toolkit clipboard layer can't
# see: copied files (paste the file, not its icon) and PNG-only
# sources like screenshot copies. Only the NSPasteboard header —
# default features would compile every AppKit binding.
objc2-app-kit = { version = "0.3.2", default-features = false, optional = true, features = [
  "std",
  "NSPasteboard",
] }

