[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sans-IO QUIC transport for baucord: quinn-proto driven from the existing threads, lane mapping, identity pinning, and an in-process simulation harness."

[lints]
workspace = true

[features]
default = []
# The server's side: its identity (key files, the certificate, retired
# keys) and `Driver::new_server`. The only user of `rcgen`, which a
# client then does not compile (review P3-3).
server = ["dep:rcgen"]
# The in-memory network + fake clock harness (spec §4.7). Pulled in by
# the transport's own tests and by the server's integration tests.
sim = ["server"]

[dependencies]
protocol = { path = "../protocol" }
bytes.workspace = true
log.workspace = true
thiserror.workspace = true
# QUIC state machine, no I/O. `log` bridges its tracing spans to the
# workspace logger; `rustls-ring` is the TLS provider (ring over aws-lc-rs
# for footprint). No default features: that would pull `bloom` (fastbloom)
# which we don't need.
# 0.11.19 at least: earlier 0.11 releases panic on a peer whose
# min_ack_delay exceeds the RTT once ack frequency is on (ours is) — a
# remote crash of the server with `panic = "abort"` (PRODUCTION-PLAN.md).
quinn-proto = { version = "0.11.19", default-features = false, features = [
  "rustls-ring",
  "log",
] }
# Synchronous UDP with GSO/GRO/ECN; no runtime. Default features would
# pull `tracing`.
quinn-udp = { version = "0.6.1", default-features = false, features = ["log"] }
rustls = { version = "0.23.43", default-features = false, features = [
  "ring",
  "std",
] }
# Self-signed Ed25519 identity certificates and the successor extension:
# the `server` feature.
rcgen = { version = "0.14.10", default-features = false, features = [
  "ring",
  "pem",
], optional = true }
# Ed25519 verification of successor proofs and client-key proofs; already
# in the tree via rustls.
ring = "0.17"
base64 = "0.23"
# quinn-proto's own rand; reused for peer ids.
rand.workspace = true
# Deterministic PRNG for the simulation harness (already in the tree
# via quinn-proto).
rand_pcg = "0.10"
# DSCP marking of the socket (voice class) on Unix.
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
env_logger.workspace = true
# The crate's own tests always build the server side.
rcgen = { version = "0.14.10", default-features = false, features = [
  "ring",
  "pem",
] }

[target.'cfg(unix)'.dependencies]
# `poll(2)` on the socket (`udp::ReadWaiter`, `UdpIo::wait_readable`):
# the client's network thread and the server's loop sleep until a
# datagram arrives or the transport's next deadline instead of polling
# on a short timer. Already in the tree (quinn-udp, socket2).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# qWAVE: the Windows way to mark a UDP flow as voice (DSCP + 802.1p) —
# IP_TOS is ignored by the Windows stack. Discord's "High Packet
# Priority" is this API. WinSock also has `WSAPoll`, the Windows
# `udp::ReadWaiter` (review P1-1).
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_QoS",
] }
