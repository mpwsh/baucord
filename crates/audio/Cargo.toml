[package]
name = "audio"
version = "0.6.0"
edition = "2021"
description = "audio components for baucord"

[lints]
workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
# Audio I/O
cpal = "0.18"
dasp_sample = "0.11"

# Wav reading
hound = "3.5"

# Lock-free ring buffer (RT-safe)
rtrb = "0.4"

# Bounded channels
crossbeam-channel.workspace = true

# Opus codec. `opusic-sys` is the same -sys crate `opus` 0.4 links (no
# second libopus); it is listed only for `opus_packet_has_lbrr`, which
# opus-rs does not wrap yet (transport::packet_buffer).
opus = "0.4"
opusic-sys = "0.7"

# Resampling
rubato = "5.0"
# NOTE: must track the audioadapter major that rubato depends on (5.x for
# rubato 5.0, which requires audioadapter-buffers ^5.1) — a mismatched
# audioadapter here would resolve as a second copy with incompatible
# adapter types at the rubato boundary.
audioadapter-buffers = "5.2"

# Noise suppression (Mozilla RNNoise, pure Rust). Its VAD probability also
# drives the speaking indicator, so no separate VAD dependency is needed.
nnnoiseless = "0.5"

serde = { workspace = true, optional = true }

# Logging
log.workspace = true

# ── macOS / Linux: real-time scheduling for the audio worker threads ────
# Windows uses MMCSS directly (platform.rs). `default-features = false`
# skips the D-Bus/RTKit path on Linux: SCHED_FIFO is requested directly
# and failure (no rtprio limit) is logged and ignored.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
audio_thread_priority = { version = "0.37", default-features = false }

# ── Windows: process-exclusive system audio loopback ────────────────────
# `wasapi` wraps ActivateAudioInterfaceAsync process loopback
# (EXCLUDE_TARGET_PROCESS_TREE), which cpal cannot express. Used only by
# `stream::process_loopback`; the cpal endpoint loopback stays as the
# runtime fallback for Windows builds that predate the API (< 10 2004).
# Cost note: pulls `windows` 0.62 — compile-time only on Windows targets,
# zero footprint elsewhere (target-gated).
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"

[dev-dependencies]
# examples only — the library itself never initializes a logger
env_logger = "0.11"

[[example]]
name = "latency_profile"
path = "examples/latency.rs"

[[example]]
name = "sounds"
path = "examples/play.rs"
