[package]
name = "audio"
version = "0.4.3"
edition = "2021"
description = "audio components for baucord"

[features]
serde = ["dep:serde"]

[dependencies]
# Audio I/O
cpal = "0.18"
dasp_sample = "0.11"

# Wav reading
hound = "3.5"

# Lock-free ring buffer (RT-safe)
rtrb = "0.3"

# Bounded channels
crossbeam-channel = "0.5"

# Opus codec
#opus = { git = "https://github.com/mpwsh/opus-rs" }

# Resampling
rubato = "1.0.1"
audioadapter-buffers = "2.0"

# Noise suppression (Mozilla RNNoise, pure Rust)
nnnoiseless = "0.5"

#earshot = { git = "https://github.com/mpwsh/earshot" }
earshot = { git = "https://github.com/mpwsh/earshot", rev = "6e650a3f2c8e072509a956b12b5776bb848f0b0f" }
opus = { git = "https://github.com/SpaceManiac/opus-rs", rev = "559876660603dc8079a053e03e6438766f669e69" }
serde = { version = "1", features = ["derive"], optional = true }


# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
fltk = { version = "1.5", features = ["fltk-bundled"] }
ui = { path = "../ui" }

[[example]]
name = "stats"
path = "examples/stats.rs"

[[example]]
name = "latency_profile"
path = "examples/latency.rs"

[[example]]
name = "sounds"
path = "examples/play.rs"
