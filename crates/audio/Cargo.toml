[package]
name = "audio"
version = "0.5.1"
edition = "2021"
description = "audio components for baucord"

[lints]
workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
# Audio I/O
cpal = "0.18"
dasp_sample = "0.11"

# Wav reading
hound = "3.5"

# Lock-free ring buffer (RT-safe)
rtrb = "0.3"

# Bounded channels
crossbeam-channel.workspace = true

# Opus codec
#opus = { git = "https://github.com/mpwsh/opus-rs" }

# Resampling
rubato = "4.0"
# NOTE: must track the audioadapter major that rubato depends on (4.x for
# rubato 4.0) — a newer audioadapter here would resolve as a second copy
# with incompatible adapter types at the rubato boundary.
audioadapter-buffers = "4.0"

# Noise suppression (Mozilla RNNoise, pure Rust)
nnnoiseless = "0.5"

# Fork retired: upstream 1.x ships quantized weights in its default
# predictor, which was the fork's whole reason to exist.
earshot = "1.2"
# Deliberately pinned AHEAD of crates.io: this rev (== current master)
# uses the opusic-sys backend; the crates.io 0.3.1 release predates that
# switch. Do not "downgrade" to the registry version.
opus = { git = "https://github.com/SpaceManiac/opus-rs", rev = "559876660603dc8079a053e03e6438766f669e69" }
serde = { workspace = true, optional = true }


# Logging
log.workspace = true

# ── Windows: process-exclusive system audio loopback ────────────────────
# `wasapi` wraps ActivateAudioInterfaceAsync process loopback
# (EXCLUDE_TARGET_PROCESS_TREE), which cpal cannot express. Used only by
# `stream::process_loopback`; the cpal endpoint loopback stays as the
# runtime fallback for Windows builds that predate the API (< 10 2004).
# Cost note: pulls `windows` 0.62 — compile-time only on Windows targets,
# zero footprint elsewhere (target-gated).
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"

[dev-dependencies]
# examples only — the library itself never initializes a logger
env_logger = "0.11"
ui = { path = "../ui" }

[[example]]
name = "latency_profile"
path = "examples/latency.rs"

[[example]]
name = "sounds"
path = "examples/play.rs"
