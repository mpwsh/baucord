[package]
name = "audio"
version = "0.8.1"
edition.workspace = true
license.workspace = true
description = "audio components for baucord"

[lints]
workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
# Audio I/O. 0.18.2 minimum: 0.18.0/0.18.1 advertise 48 kHz output on
# WASAPI and then refuse to open it ("Stream configuration is not
# supported in shared mode"); 0.18.2 opens any rate via AUTOCONVERTPCM.
# `cargo update -p cpal` after bumping — the lock file keeps the old one
# otherwise.
cpal = "0.18.2"
dasp_sample = "0.11"

# Wav reading
hound = "3.5"

# Lock-free ring buffer (RT-safe)
rtrb = "0.4"

# Bounded channels
crossbeam-channel.workspace = true

# Opus codec. `opusic-sys` is the same -sys crate `opus` 0.4 links (no
# second libopus); it is listed only for `opus_packet_has_lbrr`, which
# opus-rs does not wrap yet (transport::packet_buffer).
opus = "0.4"
opusic-sys = "0.7"

# Resampling
rubato = "5.0"
# NOTE: must track the audioadapter major that rubato depends on (5.x for
# rubato 5.0, which requires audioadapter-buffers ^5.1) — a mismatched
# audioadapter here would resolve as a second copy with incompatible
# adapter types at the rubato boundary.
audioadapter-buffers = "5.2"
# The phase-aligned stereo → mono downmix for streams on a phone's call
# output (stream::downmix). Already in the tree through rubato.
realfft = "3.5"

# Noise suppression (Mozilla RNNoise, pure Rust). Its VAD probability also
# drives the speaking indicator, so no separate VAD dependency is needed.
# The library alone: its default features are a command-line tool
# (clap 3, anyhow, hound) and a `dasp` adapter, nothing the engine calls.
nnnoiseless = { version = "0.5", default-features = false }

serde = { workspace = true, optional = true }

# Logging
log.workspace = true

# ── macOS / Linux: real-time scheduling for the audio worker threads ────
# Windows uses MMCSS directly (platform.rs). `default-features = false`
# skips the D-Bus/RTKit path on Linux: SCHED_FIFO is requested directly
# and failure (no rtprio limit) is logged and ignored.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
audio_thread_priority = { version = "0.37", default-features = false }

# ── Android: audio-class nice value + the voice-call path ────────────────
# `libc`: `setpriority` / `gettid` (platform.rs). `ndk` (`audio`, with
# `api-level-28` for usage / input preset): the AAudio voice streams
# (native/aaudio.rs). `jni` + `ndk-context`: `AudioManager` mode and
# route (native/android.rs). All four are already in the graph through
# cpal's AAudio host, at the same versions.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
jni = "0.22"
ndk-context = "0.1"

# ── iOS: the voice-processing unit (echo cancellation) ──────────────────
# `native::vpio` opens Apple's VoiceProcessingIO unit through the same
# `coreaudio-rs` cpal's iOS host uses, with the property constants from
# `objc2-audio-toolbox`; `native::avsession` sets the session's mode,
# reads its route and watches its interruptions. Every crate and version
# here is already in the graph through cpal (IOS-SPEC.md §6.3), with
# features cpal already turns on, plus `AVAudioSessionRoute`.
[target.'cfg(target_os = "ios")'.dependencies]
coreaudio-rs = { version = "0.14.2", default-features = false, features = ["audio_toolbox"] }
objc2 = "0.6"
block2 = "0.6"
objc2-audio-toolbox = { version = "0.3", default-features = false, features = [
    "std",
    "AUComponent",
    "AudioUnitProperties",
] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionRoute",
    "AVAudioSessionTypes",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSDictionary",
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSValue",
] }

# ── Windows: native voice capture/render + process loopback ─────────────
# `wasapi` runs the voice capture and render pumps on threads this crate
# owns (`native::wasapi`: MMCSS-registered, event-driven shared mode,
# engine-side conversion to 48 kHz, IMMNotificationClient device events)
# and the process-exclusive system-audio loopback (`stream::process_
# loopback`). cpal remains the fallback for both if a native open fails.
# Cost note: pulls `windows` 0.62 — compile-time only on Windows targets,
# zero footprint elsewhere (target-gated).
[target.'cfg(target_os = "windows")'.dependencies]
# Resolved to third_party/wasapi (0.24.0 + `AudioClient::as_iaudioclient`,
# for the ducking opt-out) by the root `[patch.crates-io]`.
wasapi = "0.24"
# The endpoint form factor for echo cancellation (native/wasapi.rs,
# AEC-SPEC.md §4.2): `wasapi` keeps its property accessor private. Same
# 0.62 `wasapi` and `video` use, and features `wasapi` already turns on
# — but the registry, read once per render open for the user's "during
# calls" setting in the log (AEC-SPEC.md E14).
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
# examples only — the library itself never initializes a logger
env_logger.workspace = true

[[example]]
name = "latency_profile"
path = "examples/latency.rs"
