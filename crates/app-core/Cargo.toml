[package]
name = "app-core"
version = "0.3.4"
edition.workspace = true
license.workspace = true
description = "Platform-agnostic application layer for baucord — view models, chat/image/GIF pipelines, and pure app logic shared by every shell (desktop today, mobile-android / mobile-ios later)."

[lints]
workspace = true

[dependencies]
# The bounded decode/encode pipeline. Same feature set the desktop
# crate used — png/gif are the wire formats, the rest cover
# attach/paste/drop sources. No default features (no rayon etc.).
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "tiff",
] }
thiserror = "2"
log.workspace = true

[target.'cfg(unix)'.dependencies]
# `getrusage` and the page size, for the app's own CPU and memory
# figures (usage.rs). Already in the tree on every platform.
libc = "0.2"

[dev-dependencies]
# (unit tests only use std)
