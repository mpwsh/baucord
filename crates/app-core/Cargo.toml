[package]
name = "app-core"
version = "0.3.4"
edition.workspace = true
license.workspace = true
description = "Platform-agnostic application layer for baucord — view models, chat/image/GIF pipelines, and pure app logic shared by every shell (desktop today, mobile-android / mobile-ios later)."

[lints]
workspace = true

[dependencies]
# The bounded decode/encode pipeline. png/gif are the wire formats,
# jpeg/webp what a phone's gallery and a browser hand over. No default
# features (no rayon etc.).
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
thiserror.workspace = true
log.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# A desktop's files and clipboard (screenshots on Windows, scans) also
# hold BMP and TIFF; a phone's gallery does not, and its build carried
# both decoders for nothing (review 2026-10, P3-55).
image = { version = "0.25.9", default-features = false, features = ["bmp", "tiff"] }

[target.'cfg(unix)'.dependencies]
# `getrusage` and the page size, for the app's own CPU and memory
# figures (usage.rs). Already in the tree on every platform.
libc = "0.2"

[dev-dependencies]
# (unit tests only use std)
