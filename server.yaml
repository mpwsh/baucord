server:
  name: Baucord Server
  host: 0.0.0.0
  port: 5000
  public_address: null
  greeting_message: Welcome to the server!
network:
  max_clients: 64
  bytes_per_tick: 4194304
limits:
  max_sharers: 2
  max_viewers_per_stream: 8
  max_chat_bytes: 2000
  max_image_kb_per_minute: 20480         
  max_image_kb_per_minute_global: 65536
authentication:
  secure: false
  private_key_file: netcode.key
  issuer:
    bind: 127.0.0.1:5001
    password: null
logging:
  level: info
  stats_interval_secs: 3600
channels:
  - name: Lobby
    default: true
    password: null
    user_limit: null