server:
  name: Baucord Server
  host: 0.0.0.0
  port: 5000
  public_address: null
  greeting_message: Welcome to the server!
network:
  max_clients: 64
limits:
  max_sharers: 8
  max_viewers_per_stream: 16
  max_chat_bytes: 2000
  max_image_kb_per_minute: 40096
  max_image_kb_per_minute_global: 40384
  media_relay_kb_per_sec: 2048
  chat:
    burst: 5
    per_secs: 5
identity:
  dir: data/baucord
persistence:
  enabled: true
  path: data/baucord/baucord.db
  history:
    replay: 50
    retain_days: 90
  files:
    max_mb: 50
    per_user_daily_mb: 500
    total_cap_gb: 20
    retain_days: 30
  avatars:
    max_kb: 256
  telemetry:
    retain_days: 30
logging:
  level: info
  stats_interval_secs: 1800
  link_stats_interval_secs: 300
  telemetry: true
  file: server.log
channels:
  - name: Lobby
    default: true
    password: null
    user_limit: null
  - name: AFK
    password: null
    user_limit: null
user_channels:
  max_per_user: 2
  temporary_after_min: 30
  afk_channel: AFK
  afk_after_min: 30
