server:
  name: Baucord Server
  host: 0.0.0.0
  port: 5000
  public_address: "216.238.121.18:5000"
  greeting_message: Welcome to the server!
network:
  max_clients: 64
  bytes_per_tick: 4194304
limits:
  max_sharers: 5
  max_viewers_per_stream: 8
  media_relay_kb_per_sec: 1024
  max_chat_bytes: 2000
  max_image_kb_per_minute: 20480
  max_image_kb_per_minute_global: 65536
logging:
  level: info
  stats_interval_secs: 3600
authentication:
  secure: true
  private_key_file: netcode.key
  issuer:
    bind: "0.0.0.0:5001"
    password: conos
channels:
  - name: Lobby
    default: true
  - name: Faceit
    user_limit: 10
  - name: Dark And Darker
    user_limit: 10
  - name: Pummel
    user_limit: 10
