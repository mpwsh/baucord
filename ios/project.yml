# baucord's iOS app as an Xcode project, for XcodeGen (IOS-SPEC.md §11).
#
# `xcodegen generate` (ios/run.sh runs it) writes baucord.xcodeproj and
# Generated/Info.plist from this file; neither is committed. There is
# no Swift or Objective-C: the app is crates/ios, built by cargo in the
# "Build the app with cargo" phase below, which puts the binary where
# Xcode expects the app's executable. Everything else here is what an
# iOS app bundle has to declare.
#
# Machine-specific settings (the signing team, another bundle id) live
# in Config/Local.xcconfig, which Config/Base.xcconfig includes when it
# exists — copy Config/Local.xcconfig.example.

name: baucord

options:
  bundleIdPrefix: dev.baucord
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    # The cargo phase reads the whole repository and writes target/;
    # Xcode 15+ sandboxes script phases unless told otherwise.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  baucord:
    type: application
    platform: iOS
    # iOS 17: the voice-processing ducking control, AVAudioApplication
    # and every iPhone from the XS on (spec D4).
    deploymentTarget: "17.0"
    scheme: {}

    settings:
      base:
        PRODUCT_NAME: baucord
        PRODUCT_BUNDLE_IDENTIFIER: $(BAUCORD_BUNDLE_ID)
        # iPhone only in v1 (spec D5); an iPad runs it in its iPhone frame.
        TARGETED_DEVICE_FAMILY: "1"
        # Every iPhone that runs iOS 17 and the simulator on Apple
        # silicon are arm64; the cargo phase builds exactly that.
        ARCHS: arm64
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION come from
        # Config/Version.xcconfig (ios/run.sh writes it from the crate's
        # version); set here they would override it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

    sources:
      - path: Resources/Assets.xcassets

    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: baucord
        CFBundleDevelopmentRegion: en
        # XcodeGen's defaults are "1.0" and "1": point them at the build
        # settings so the version and the build number are real.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # The scene life cycle, which iOS 27 requires to launch at all:
        # Slint's winit backend provides the delegate (Slint ≥ 1.18).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
        # The app's background colour while it starts, not white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The theme is dark: dark keyboard, dark system sheets, light
        # status-bar text.
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # 120 Hz on ProMotion iPhones (otherwise capped at 60).
        CADisableMinimumFrameDurationOnPhone: true
        # Keeps the app running while audio is — i.e. while in voice
        # (spec §4.1).
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: baucord uses the microphone while you are in a voice channel.
        NSLocalNetworkUsageDescription: baucord connects to servers on your local network when you add one by its local address.
        # Documents (the log, saved files) as the app's folder in the
        # Files app (spec §8).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

    preBuildScripts:
      - name: App icon from assets/icons/icon.png
        # Through bash, so a checkout without the executable bit (files
        # committed from Windows) still builds.
        script: 'bash "${SRCROOT}/scripts/render_icon.sh"'
        inputFiles:
          - $(SRCROOT)/../assets/icons/icon.png
        outputFiles:
          - $(SRCROOT)/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png

    postCompileScripts:
      - name: Build the app with cargo
        script: 'bash "${SRCROOT}/scripts/build_with_cargo.sh"'
        # Always run: cargo decides what is out of date.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
