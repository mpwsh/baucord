# JVM for the Gradle daemon. The Rust build runs outside it (cargo-ndk
# as an Exec task), so this is only Gradle + AGP.
# Headless AWT: the launcher-icon task draws with java.awt, which on
# macOS would otherwise put a Java icon in the Dock.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
# Gradle 8.14 runs on JDK 17–24; `gradlew` takes JAVA_HOME. If JAVA_HOME
# has to stay on something else, point the daemon at a JDK 21 from your
# user-level %USERPROFILE%\.gradle\gradle.properties instead (machine
# paths do not belong in the repo):
#   org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.8.9-hotspot
org.gradle.parallel=true
org.gradle.caching=true

# ── Rust build knobs, read by app/build.gradle.kts ─────────────────────
# Override on the command line: ./gradlew assembleDebug -PcargoTargets=x86_64
# ABIs cargo-ndk builds (Android names). Left unset here, the build
# script picks: a release build arm64-v8a only, any other both, so the
# same debug APK runs on the emulator and a phone. This line used to
# say "both" for every build, so the comment's "release keeps arm64-v8a
# only" was true of the release workflow alone (review P3-46).
#cargoTargets=arm64-v8a,x86_64
# "hello" builds the M0 smoke test instead of the client
# (--no-default-features --features hello). Empty = the real app.
cargoFeatures=
