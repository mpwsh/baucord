services:
  baucord:
    container_name: baucord
    #image: mpwsh/baucord:latest
    build: .
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "5000:5000/udp"
    volumes:
      - ./config/baucord.yaml:/app/server.yaml
      - ./data/baucord:/app/data
    networks:
      baucord:

networks:
  baucord:
