# One service: the relay. Everything — media, chat, admission — rides
# one QUIC port over UDP. config/baucord.yaml is this host's own config
# (start from https://baucord.com/deploy/baucord.yaml); ./data/baucord holds the
# server's identity key and database: back it up. The guide, and this
# file to download: https://baucord.com/deploy.html
services:
  baucord:
    container_name: baucord
    # Published on every release (x86-64). Update: docker compose pull,
    # then docker compose up -d (or run scripts/setup.sh again).
    image: mpwsh/baucord:latest
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # The same number as server.port in config/baucord.yaml. Moving a
      # server off another port: publish both while saved addresses
      # catch up, e.g. also "5000:51000/udp".
      - "51000:51000/udp"
    # The folder, not the file: an editor that saves by writing a new
    # file and renaming it over the old one (vim, nano with backups,
    # most GUI editors) leaves a single-file mount pointing at the old
    # one, and the running server never saw the channel change.
    environment:
      BAUCORD_CONFIG: /app/config/baucord.yaml
    volumes:
      - ./config:/app/config
      - ./data/baucord:/app/data
    # The server logs to stderr here, so this is its log: kept to
    # 5 × 10 MB instead of growing for ever (it names people and IPs).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      baucord:

networks:
  baucord:
