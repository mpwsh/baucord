[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["x@mpw.sh"]

# ── Shared lints (inherited by crates via `[lints] workspace = true`) ────
[workspace.lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 3 }
redundant_clone = { level = "deny", priority = 9 }

# ── Release: fast binary ────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1 # better optimization, slower compile
panic = "abort"   # ~10% smaller binary, no unwind overhead

# ── Deploy: ship to users ──────────────────────────────────────────────
[profile.deploy]
inherits = "release"
strip = "symbols"
lto = "fat"          # squeeze out the last few % at link time

# ── Debug-opt: release speed with debug symbols ────────────────────────
[profile.debug-opt]
inherits = "release"
debug = 2
debug-assertions = true
incremental = true
# override: keep unwind so backtraces work in profiling
panic = "unwind"

# ── Dev: fast compile, tolerable runtime ───────────────────────────────
[profile.dev]
opt-level = 1

# Optimize all dependencies even in dev — they don't change often
# and unoptimized audio/codec code is unusably slow.
[profile.dev.package."*"]
opt-level = 3
