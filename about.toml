# cargo-about: the third-party notices the apps show (Settings →
# Licenses) and the site publishes (web/licenses.html), through
# `scripts/licenses.py`, which CI runs before every build and deploy
# (.github/workflows/licenses.yml; licenses/README.md).
#
# Order matters: for a crate offered under several licenses, the first
# one listed here is the one we take (MIT before Apache-2.0 keeps the
# notices short; the Slint crates are taken under their royalty-free
# license, whose attribution is the AboutSlint widget in Settings →
# About — never under the GPL, which the iOS build cannot carry).
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MIT-0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "WTFPL",
  "LicenseRef-Slint-Royalty-free-2.0",
]
# Every build that ships: the desktop apps, the phones, and the server.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]
