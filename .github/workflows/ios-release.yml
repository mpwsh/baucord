# Builds the iOS app on release (or manual run). With the signing secrets it
# exports an Ad Hoc .ipa and attaches it to the release; without them the
# unsigned build is only a workflow artifact.
# Secrets: IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROFILE_BASE64.
# Variable (optional): IOS_BUNDLE_ID (default dev.baucord).
name: ios-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to label the build with (dry run: the .ipa is a workflow artifact, not a release asset)"
        default: "manual"

permissions:
  contents: write   # gh release upload

jobs:
  licenses:
    uses: ./.github/workflows/licenses.yml

  ipa:
    needs: licenses
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      XCODE_APP: /Applications/Xcode_26.6.app
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'dev.baucord' }}
      # Secrets can't be tested in a step's `if:`; these env copies can.
      P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
      # The runner's CMake 4 rejects libopus' old cmake_minimum_required.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download license files
        uses: actions/download-artifact@v8
        with:
          name: licenses
          path: .

      - name: Check tag matches crate version
        if: startsWith(env.TAG, 'v')
        run: |
          set -eu
          CRATE="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [ "${TAG#v}" != "$CRATE" ]; then
            echo "::error::release tag $TAG, but Cargo.toml says $CRATE — bump `[workspace.package]`, then tag v$CRATE"
            exit 1
          fi
          echo "version $CRATE"

      - name: Select Xcode and install XcodeGen
        run: |
          set -eux
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          brew install xcodegen
          cmake --version

      - name: Install Rust toolchain and iOS target
        run: |
          set -eux
          rustup toolchain install
          rustup target add aarch64-apple-ios
          rustup show active-toolchain

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-release-arm64
          save-if: ${{ github.event_name != 'release' }}

      - name: Install signing certificate and profile
        if: ${{ env.P12_B64 != '' && env.PROFILE_B64 != '' }}
        env:
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/baucord-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/adhoc.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep "Apple Distribution" >/dev/null; then
            security find-identity -v -p codesigning "$KEYCHAIN"
            echo "::error::the .p12 holds no \"Apple Distribution\" identity with its key — export the certificate *with* its private key (Keychain Access → My Certificates)"
            exit 1
          fi

          security cms -D -i "$RUNNER_TEMP/adhoc.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PB=/usr/libexec/PlistBuddy
          UUID="$($PB -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$($PB -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          TEAM="$($PB -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          APPID="$($PB -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          if [ "$APPID" != "$TEAM.$BUNDLE_ID" ]; then
            echo "::error::the profile is for $APPID, the build for $TEAM.$BUNDLE_ID — make the profile for $BUNDLE_ID, or set the IOS_BUNDLE_ID variable to the profile's app id"
            exit 1
          fi
          if ! $PB -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/devices.txt" 2>/dev/null; then
            echo "::error::\"$NAME\" lists no devices: not an Ad Hoc profile (an App Store one is for TestFlight, which this workflow does not upload to)"
            exit 1
          fi
          DEVICES="$(grep -c '^ ' "$RUNNER_TEMP/devices.txt" || true)"
          echo "profile \"$NAME\" ($UUID): team $TEAM, $APPID, $DEVICES device(s), expires $($PB -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"

          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/adhoc.mobileprovision" "$DIR/$UUID.mobileprovision"
          done
          {
            echo "SIGNED=1"
            echo "KEYCHAIN=$KEYCHAIN"
            echo "TEAM_ID=$TEAM"
            echo "PROFILE_NAME=$NAME"
          } >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -eux
          VERSION="$(awk -F'"' '/^version = "/ { print $2; exit }' ../Cargo.toml)"
          printf '%s\n' \
            "// Written by .github/workflows/ios-release.yml." \
            "MARKETING_VERSION = $VERSION" \
            "CURRENT_PROJECT_VERSION = ${{ github.run_number }}" > Config/Version.xcconfig
          xcodegen generate --quiet

      - name: Archive app (Release, arm64)
        run: |
          set -euo pipefail
          ARGS=(
            -project ios/baucord.xcodeproj
            -scheme baucord
            -configuration Release
            -destination generic/platform=iOS
            -archivePath "$RUNNER_TEMP/baucord.xcarchive"
            BAUCORD_BUNDLE_ID="$BUNDLE_ID"
          )
          if [ "${SIGNED:-}" = 1 ]; then
            ARGS+=(
              CODE_SIGN_STYLE=Manual
              DEVELOPMENT_TEAM="$TEAM_ID"
              CODE_SIGN_IDENTITY="Apple Distribution"
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
              OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
            )
          else
            ARGS+=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild "${ARGS[@]}" archive

      - name: Verify app architecture and deployment target
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/baucord.xcarchive/Products/Applications/baucord.app"
          lipo -info "$APP/baucord"
          MINOS="$(otool -l "$APP/baucord" | awk '/LC_BUILD_VERSION/ { f = 1 } f && /minos/ { print $2; exit }')"
          echo "minos: $MINOS"
          if [ "$MINOS" != "17.0" ]; then
            echo "::error::the binary targets iOS $MINOS, not 17.0 (IPHONEOS_DEPLOYMENT_TARGET did not reach cargo?)"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$APP/Info.plist"

      - name: Export signed .ipa
        if: ${{ env.SIGNED == '1' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/baucord.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/baucord.ipa" "baucord-ios-${TAG}.ipa"
          mkdir -p "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          unzip -q "$GITHUB_WORKSPACE/baucord-ios-${TAG}.ipa"
          codesign --verify --deep --strict Payload/baucord.app
          codesign -dv Payload/baucord.app 2>&1 | grep -E "Identifier|Authority=Apple Distribution|TeamIdentifier"

      - name: Package unsigned .ipa
        if: ${{ env.SIGNED != '1' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$RUNNER_TEMP/baucord.xcarchive/Products/Applications/baucord.app" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "$GITHUB_WORKSPACE/baucord-ios-${TAG}-unsigned.ipa" Payload)

      - name: Collect output files
        id: out
        run: |
          set -eu
          if [ "${SIGNED:-}" = 1 ]; then
            echo "ipa=baucord-ios-${TAG}.ipa" >> "$GITHUB_OUTPUT"
          else
            echo "ipa=baucord-ios-${TAG}-unsigned.ipa" >> "$GITHUB_OUTPUT"
          fi
          if [ -d "$RUNNER_TEMP/baucord.xcarchive/dSYMs" ]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/baucord.xcarchive/dSYMs" "baucord-ios-${TAG}-dSYMs.zip"
            echo "dsyms=baucord-ios-${TAG}-dSYMs.zip" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the archive has no dSYMs"
          fi

      - name: Upload .ipa and dSYMs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.out.outputs.ipa }}
          path: |
            ${{ steps.out.outputs.ipa }}
            ${{ steps.out.outputs.dsyms }}
          if-no-files-found: error

      - name: Attach .ipa to release
        if: ${{ github.event_name == 'release' && env.SIGNED == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.out.outputs.ipa }}" --clobber

      - name: Delete signing keychain
        if: ${{ always() && env.KEYCHAIN != '' }}
        run: security delete-keychain "$KEYCHAIN" || true
