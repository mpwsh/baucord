# Builds the Android APK and Play bundle on release, or on a manual run with a
# release tag. The signed APK is attached to the release and uploaded to R2;
# the bundle is a workflow artifact for Play Console.
# Secrets: BAUCORD_KEYSTORE_BASE64, BAUCORD_KEYSTORE_PASSWORD,
#          BAUCORD_KEY_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
name: android-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag (v1.1.9) to rebuild and attach to that release; anything else is a dry run (workflow artifact only)"
        default: "manual"

permissions:
  contents: write   # gh release upload

jobs:
  licenses:
    uses: ./.github/workflows/licenses.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v') && github.event.inputs.tag || '' }}

  android:
    needs: licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      # Not a secret: GitHub masks secret values everywhere in the log.
      KEY_ALIAS: baucord
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v') && github.event.inputs.tag || '' }}

      - name: Download license files
        uses: actions/download-artifact@v8
        with:
          name: licenses
          path: .

      - name: Check tag matches crate version
        if: startsWith(env.TAG, 'v')
        run: |
          set -eu
          CRATE="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [ "${TAG#v}" != "$CRATE" ]; then
            echo "::error::release tag $TAG, but Cargo.toml says $CRATE — bump `[workspace.package]`, then tag v$CRATE"
            exit 1
          fi
          echo "version $CRATE"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          LIST=$(sdkmanager --list 2>/dev/null)
          NDK=$(echo "$LIST" | grep -oE 'ndk;29\.[0-9.]+' | sort -V | tail -1)
          BT=$(echo "$LIST"  | grep -oE 'build-tools;36\.[0-9.]+' | sort -V | tail -1)
          CM=$(echo "$LIST"  | grep -oE 'cmake;[0-9.]+' | sort -V | tail -1)
          echo "ndk=$NDK build-tools=$BT cmake=$CM"
          sdkmanager "platforms;android-36" "$BT" "build-tools;35.0.0" "$NDK" "$CM" "platform-tools"
          NDK_DIR="$ANDROID_HOME/ndk/${NDK#ndk;}"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/${CM/;//}/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain and Android target
        run: |
          set -eux
          rustup toolchain install
          rustup target add aarch64-linux-android
          rustup show active-toolchain

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-release-arm64

      # A pinned, prebuilt cargo-ndk (its own release binaries, through
      # cargo-binstall). `cargo install` compiled whatever was newest
      # from source on every run (review P3-48).
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Build release APK and bundle (arm64-v8a)
        working-directory: android
        run: |
          set -eux
          chmod +x gradlew
          cargo ndk --version
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PcargoTargets=arm64-v8a \
            -PbaucordVersionCode="${{ github.run_number }}" \
            -PbaucordVersionName="${TAG#v}"
          ls -la app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - name: Check 16 KB page alignment
        run: |
          set -eux
          SO=android/app/src/main/jniLibs/arm64-v8a/libbaucord_android.so
          READELF="$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          "$READELF" -l "$SO" | grep LOAD
          if "$READELF" -l "$SO" | grep LOAD | grep -v 0x4000; then
            echo "a LOAD segment is not 16 KB aligned"; exit 1
          fi

      - name: Sign APK
        id: apk
        env:
          RELEASE_KS_B64: ${{ secrets.BAUCORD_KEYSTORE_BASE64 }}
          RELEASE_KS_PASS: ${{ secrets.BAUCORD_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASS: ${{ secrets.BAUCORD_KEY_PASSWORD }}
        run: |
          set -eu
          BT="$(printf '%s\n' "$ANDROID_HOME"/build-tools/36.* | sort -V | tail -1)"
          APK_IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          KS="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KS"' EXIT
          RELEASE_KEY_PASS="${RELEASE_KEY_PASS:-$RELEASE_KS_PASS}"
          export RELEASE_KS_PASS RELEASE_KEY_PASS
          "$BT/zipalign" -P 16 -f 4 "$APK_IN" aligned.apk
          if [ -n "$RELEASE_KS_B64" ]; then
            printf '%s' "$RELEASE_KS_B64" | tr -d ' \r\n' | base64 -d > "$KS"
            APK="baucord-${TAG}-android-arm64.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:RELEASE_KS_PASS --key-pass env:RELEASE_KEY_PASS \
              --v4-signing-enabled false --out "$APK" aligned.apk
            "$BT/apksigner" verify --print-certs "$APK" \
              | awk '/certificate SHA-256 digest/ { d = toupper($NF); gsub(/../, "&:", d); sub(/:$/, "", d); print "release key SHA-256: " d }'
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            APK="baucord-${TAG}-android-arm64-unsigned.apk"
            cp aligned.apk "$APK"
            echo "::warning::no release key: the APK is unsigned (artifact only)"
          fi
          rm -f aligned.apk
          "$BT/zipalign" -c -P 16 4 "$APK"
          echo "name=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.name }}
          archive: false
          if-no-files-found: error

      - name: Attach APK to release
        if: ${{ env.SIGNED == '1' && (github.event_name == 'release' || startsWith(env.TAG, 'v')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Stage APK for website
        if: ${{ env.SIGNED == '1' && (github.event_name == 'release' || startsWith(env.TAG, 'v')) }}
        env:
          APK: ${{ steps.apk.outputs.name }}
        run: |
          set -eux
          mkdir -p r2-upload
          cp "$APK" r2-upload/
      - name: Upload APK to R2
        if: ${{ env.SIGNED == '1' && (github.event_name == 'release' || startsWith(env.TAG, 'v')) }}
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --content-type application/vnd.android.package-archive
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: r2-upload

      - name: Sign app bundle
        id: aab
        env:
          RELEASE_KS_B64: ${{ secrets.BAUCORD_KEYSTORE_BASE64 }}
          RELEASE_KS_PASS: ${{ secrets.BAUCORD_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASS: ${{ secrets.BAUCORD_KEY_PASSWORD }}
        run: |
          set -eu
          AAB_IN=android/app/build/outputs/bundle/release/app-release.aab
          KS="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KS"' EXIT
          RELEASE_KEY_PASS="${RELEASE_KEY_PASS:-$RELEASE_KS_PASS}"
          export RELEASE_KS_PASS RELEASE_KEY_PASS
          if [ -n "$RELEASE_KS_B64" ]; then
            printf '%s' "$RELEASE_KS_B64" | tr -d ' \r\n' | base64 -d > "$KS"
            AAB="baucord-${TAG}-android.aab"
            cp "$AAB_IN" "$AAB"
            jarsigner -keystore "$KS" -storepass:env RELEASE_KS_PASS \
              -keypass:env RELEASE_KEY_PASS "$AAB" "$KEY_ALIAS"
            jarsigner -verify "$AAB"
            keytool -printcert -jarfile "$AAB" \
              | awk '/SHA256:/ { print "release key SHA-256: " $2 }'
          else
            AAB="baucord-${TAG}-android-unsigned.aab"
            cp "$AAB_IN" "$AAB"
            echo "::warning::no release key: the bundle is unsigned (Play refuses it)"
          fi
          if ! unzip -l "$AAB" | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols/"; then
            echo "::warning::no native debug symbols in the bundle"
          fi
          echo "name=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.aab.outputs.name }}
          archive: false
          if-no-files-found: error
