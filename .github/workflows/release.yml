# Builds the desktop app (Windows, macOS, Linux) with the bundled server on
# release, attaches the zips to the release and uploads them to R2 with the
# version file. Pushes to the default branch only build, to warm the caches.
name: Build and Release
on:
  release:
    types: [published]
  push:
    branches:
      # The default branch: a tag build can only restore caches saved on
      # it. This said "chunk", a branch that no longer exists, so nothing
      # ever saved one and every release rebuilt FFmpeg, x264, PipeWire
      # and the workspace on all four runners (review P2-50).
      - "main"
    # What cannot change the desktop build warms nothing (review
    # 2026-10, P3-59).
    paths-ignore:
      - "**.md"
      - "web/**"
      - "android/**"
      - "ios/**"
      - "crates/android/**"
      - "crates/ios/**"
      - "tools/**"
      - "config/**"
      - "docker-compose.yaml"
      - "Dockerfile"

# A newer push to main supersedes a cache-warming build still running;
# a release always runs to the end.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # FFmpeg stays on 7.1.x: ffmpeg-next 8.1 does not build against FFmpeg 8+.
  VCPKG_COMMIT: 34823ada10080ddca99b60e85f80f55e18a44eea # ffmpeg 7.1.2
  # The Linux and macOS builds take the same release as vcpkg, checked
  # against this digest (the tarball from https://ffmpeg.org/releases/,
  # 2026-10-16). Must match the FFmpeg entry in scripts/licenses.py.
  FFMPEG_VERSION: 7.1.2
  FFMPEG_SHA256: 089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304
  # Must match the x264 entry in scripts/licenses.py.
  X264_COMMIT: 31e19f92f00c7003fa115047ce50978bc98c3a0d

jobs:
  licenses:
    uses: ./.github/workflows/licenses.yml

  # A release's tag has to be the workspace's version. Checked first:
  # it used to be the last job's business, after an hour of builds.
  # (A push has no tag; the job passes with nothing to do.)
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        if: github.event_name == 'release'
        uses: actions/checkout@v7
      - name: Check tag matches crate version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG != workspace version v$VERSION — retag or bump the version."
            exit 1
          fi

  build:
    needs: [licenses, tag]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            # Built in 22.04 so the binary needs glibc 2.35 at most.
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-intel
            rustflags: "-C target-cpu=x86-64-v2"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash # containers default to sh
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download license files
        uses: actions/download-artifact@v8
        with:
          name: licenses
          path: .
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y \
            build-essential curl git ca-certificates zip binutils \
            meson ninja-build \
            pkg-config cmake nasm libclang-dev \
            libasound2-dev \
            libx11-dev libxext-dev libxcursor-dev \
            libxfixes-dev libfontconfig1-dev \
            libgbm-dev \
            libxcb1-dev libxrandr-dev \
            libudev-dev \
            libwayland-dev libegl-dev
          # Not here any more (review P3-48): libopus (the audio crate
          # builds its own), libdbus (the tray speaks D-Bus in Rust), and
          # Xinerama, Xrender, Xft, pango and cairo, which the toolkit
          # before Slint wanted. No crate in Cargo.lock links any of
          # them; pr-check.yaml builds and tests without them.

      # The toolchain rust-toolchain.toml pins, which is the one cargo
      # runs. `@stable` installed another that nothing used, and rustup
      # then fetched the pinned one at the first cargo call (review
      # P3-48).
      - name: Read the pinned Rust toolchain
        id: toolchain
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'release' }}

      # Restored everywhere, saved only from main: a release's cache is
      # scoped to its tag, where no later run can read it, and it could
      # evict main's (review 2026-10, P2-48).
      - name: Cache PipeWire headers (Linux)
        if: runner.os == 'Linux'
        id: pipewire-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/pw
          key: pipewire-1.0.7-ubuntu2204-container-v1

      - name: Build PipeWire 1.0.7 headers + client lib (Linux)
        if: runner.os == 'Linux' && steps.pipewire-cache.outputs.cache-hit != 'true'
        # dbus and flatpak are the two options PipeWire turns on by
        # default that need a library: libdbus and GLib, which the
        # packages above no longer bring in. Off, the headers, the .pc
        # files and libpipewire's symbols come out the same.
        run: |
          set -euo pipefail
          cd /tmp
          curl -LO https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.0.7/pipewire-1.0.7.tar.gz
          tar xf pipewire-1.0.7.tar.gz
          cd pipewire-1.0.7
          meson setup build --prefix="$HOME/pw" -Dbuildtype=release \
            -Dsession-managers=[] -Dexamples=disabled -Dtests=disabled -Dman=disabled \
            -Ddbus=disabled -Dflatpak=disabled
          meson compile -C build
          meson install -C build

      - name: Save PipeWire headers (Linux)
        if: runner.os == 'Linux' && steps.pipewire-cache.outputs.cache-hit != 'true' && github.event_name != 'release'
        uses: actions/cache/save@v6
        with:
          path: ~/pw
          key: pipewire-1.0.7-ubuntu2204-container-v1

      - name: Cache static FFmpeg (Linux)
        if: runner.os == 'Linux'
        id: ffmpeg-static-linux-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-${{ env.FFMPEG_VERSION }}-x264-${{ env.X264_COMMIT }}-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-container-v5

      - name: Build static FFmpeg + x264 (Linux)
        if: runner.os == 'Linux' && steps.ffmpeg-static-linux-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PREFIX="$HOME/ffmpeg-static"
          mkdir -p "$PREFIX" /tmp/ffbuild
          cd /tmp/ffbuild
          git clone https://code.videolan.org/videolan/x264.git
          cd x264
          git checkout "$X264_COMMIT"
          ./configure --prefix="$PREFIX" --enable-static --enable-pic --disable-cli --disable-opencl
          make -j"$(nproc)"
          make install
          cd /tmp/ffbuild
          curl -LO "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg-$FFMPEG_VERSION.tar.xz" | sha256sum -c -
          tar xf "ffmpeg-$FFMPEG_VERSION.tar.xz"
          cd "ffmpeg-$FFMPEG_VERSION"
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" ./configure \
            --prefix="$PREFIX" \
            --disable-shared --enable-static --enable-pic \
            --disable-programs --disable-doc \
            --disable-autodetect --disable-avdevice \
            --disable-avfilter --disable-swresample \
            --enable-gpl --enable-libx264
          make -j"$(nproc)"
          make install

      - name: Save static FFmpeg (Linux)
        if: runner.os == 'Linux' && steps.ffmpeg-static-linux-cache.outputs.cache-hit != 'true' && github.event_name != 'release'
        uses: actions/cache/save@v6
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-${{ env.FFMPEG_VERSION }}-x264-${{ env.X264_COMMIT }}-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-container-v5

      - name: Use static FFmpeg + built PipeWire (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-static/lib/pkgconfig:$HOME/pw/lib/x86_64-linux-gnu/pkgconfig:$HOME/pw/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALL_STATIC=1" >> "$GITHUB_ENV"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install opus pkg-config nasm

      - name: Cache static FFmpeg (macOS)
        if: runner.os == 'macOS'
        id: ffmpeg-static-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-${{ env.FFMPEG_VERSION }}-x264-${{ env.X264_COMMIT }}-${{ runner.os }}-${{ runner.arch }}-v4

      - name: Set macOS deployment target (11.0)
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build static FFmpeg + x264 (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-static-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PREFIX="$HOME/ffmpeg-static"
          mkdir -p "$PREFIX" /tmp/ffbuild
          cd /tmp/ffbuild
          git clone https://code.videolan.org/videolan/x264.git
          cd x264
          git checkout "$X264_COMMIT"
          ./configure --prefix="$PREFIX" --enable-static --disable-cli --disable-opencl
          make -j"$(sysctl -n hw.ncpu)"
          make install
          cd /tmp/ffbuild
          curl -LO "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg-$FFMPEG_VERSION.tar.xz" | shasum -a 256 -c -
          tar xf "ffmpeg-$FFMPEG_VERSION.tar.xz"
          cd "ffmpeg-$FFMPEG_VERSION"
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" ./configure \
            --prefix="$PREFIX" \
            --disable-shared --enable-static \
            --disable-programs --disable-doc \
            --disable-autodetect --disable-avdevice \
            --disable-avfilter --disable-swresample \
            --enable-gpl --enable-libx264 --enable-videotoolbox
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Save static FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-static-cache.outputs.cache-hit != 'true' && github.event_name != 'release'
        uses: actions/cache/save@v6
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-${{ env.FFMPEG_VERSION }}-x264-${{ env.X264_COMMIT }}-${{ runner.os }}-${{ runner.arch }}-v4

      - name: Use static FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-static/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALL_STATIC=1" >> "$GITHUB_ENV"

      - name: Download prebuilt FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          $obj = "ci/ffmpeg-$($env:VCPKG_COMMIT.Substring(0,10))-x264-gpl-nvcodec-amf-x64-windows-static-md.zip"
          aws s3 cp "s3://baucord/$obj" ffmpeg-prebuilt.zip --endpoint-url https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          7z x ffmpeg-prebuilt.zip -oC:\ffmpeg-prebuilt
          echo "FFMPEG_DIR=C:\ffmpeg-prebuilt\x64-windows-static-md" >> $env:GITHUB_ENV

      # No sccache: the Rust cache above restores `target/` from the
      # default branch's build, which is the same saving without a
      # second cache, a wrapper around rustc and a shim for Windows'
      # command-line limit (review P2-50).
      - name: Build desktop app and server
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        # Only what ships: the desktop app and the server. Every member
        # used to build, and the iOS crate's stub binary is also named
        # `baucord` — both landed on the same path and the zip got
        # whichever linked last (review P0-5).
        # --locked: Cargo.lock decides, as in pr-check and the image.
        run: cargo build --locked --profile deploy --target ${{ matrix.target }} -p desktop -p server --features desktop/tray

      - name: Verify FFmpeg statically linked + glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/deploy/baucord"
          echo "── dynamic dependencies ──"
          # Read once into a variable: a grep that stops early on a pipe
          # can fail its writer under pipefail (review 2026-10, P3-58).
          DEPS="$(ldd "$BIN")"
          echo "$DEPS"
          if grep -q "not found" <<<"$DEPS"; then
            echo "::error::baucord needs a library this system does not have"
            exit 1
          fi
          if grep -E "libav|libsw|libpostproc|libx264" <<<"$DEPS"; then
            echo "::error::baucord still links FFmpeg/x264 shared objects — the static build was not picked up"
            exit 1
          fi
          if grep -E "=> (/home|/opt|/usr/local)/" <<<"$DEPS"; then
            echo "::error::baucord links a library from outside the system paths — a runner dependency leaked"
            exit 1
          fi
          MAX=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version required: $MAX"
          if [ "$(printf '%s\n' "$MAX" GLIBC_2.35 | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::binary requires $MAX (> 2.35) — something escaped the ubuntu:22.04 container"
            exit 1
          fi

      - name: Verify FFmpeg statically linked (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="target/${{ matrix.target }}/deploy/baucord"
          echo "── dynamic dependencies ──"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -E "libav|libsw|libpostproc"; then
            echo "::error::baucord still links FFmpeg dylibs — the static build was not picked up"
            exit 1
          fi
          if otool -L "$BIN" | grep -E "/usr/local/|/opt/homebrew/"; then
            echo "::error::baucord links a Homebrew library — the static FFmpeg picked up a runner dependency"
            exit 1
          fi
          # From a file: awk stops at the first match, and the otool it
          # cut off would fail the step under pipefail (P3-58).
          otool -l "$BIN" > "$RUNNER_TEMP/loadcmds.txt"
          MINOS=$(awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}' "$RUNNER_TEMP/loadcmds.txt")
          echo "minos: $MINOS"
          if [ "$(printf '%s\n' "$MINOS" 11.0 | sort -V | tail -1)" != "11.0" ]; then
            echo "::error::binary targets macOS $MINOS (> 11.0) — MACOSX_DEPLOYMENT_TARGET was not honoured"
            exit 1
          fi

      - name: Read version from crates/desktop
        id: version
        shell: bash
        run: echo "version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Package zip (Linux/macOS)
        if: runner.os != 'Windows' && github.event_name == 'release'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/deploy/baucord staging/baucord
          cp target/${{ matrix.target }}/deploy/server staging/dedicated-server
          cd staging
          zip -r ../baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip baucord dedicated-server

      - name: Package zip (Windows)
        if: runner.os == 'Windows' && github.event_name == 'release'
        shell: pwsh
        run: |
          mkdir staging
          copy target\${{ matrix.target }}\deploy\baucord.exe staging\baucord.exe
          copy target\${{ matrix.target }}\deploy\server.exe staging\dedicated-server.exe
          cd staging
          Compress-Archive -Path baucord.exe,dedicated-server.exe -DestinationPath ..\baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip

      - name: Upload zip artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          path: baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download build zips
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: baucord-v*
          merge-multiple: true
      - name: Attach zips to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*.zip
      # The version file tells every client what to update to, and the
      # site which version to offer: only the newest stable release
      # writes it, never a backport or a rebuilt older tag (review
      # 2026-10, P2-27).
      - name: Is this the newest release?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          NEWEST=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [ "$PRERELEASE" != "true" ] && [ "$TAG" = "$NEWEST" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not the newest stable release ($NEWEST): the version file stays"
          fi
      - name: Stage zips and version file for R2
        run: |
          VERSION=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          mkdir -p r2-upload r2-version
          cp artifacts/*.zip r2-upload/
          echo "$VERSION" > r2-version/version
      - name: Upload zips to R2
        uses: jakejarvis/s3-sync-action@v0.5.1
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: r2-upload
      # Last, in a step of its own: the updater and the website read
      # this file, and the zips it names have to be there already. It
      # went up in the same sync as they did, in no particular order
      # (review P2-60).
      - name: Upload version file to R2
        if: steps.newest.outputs.newest == 'true'
        uses: jakejarvis/s3-sync-action@v0.5.1
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: r2-version
