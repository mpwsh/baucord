name: Build and Release
on:
  release:
    types: [published]
  #push:
  #  branches:
  #    - "chunk"
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            # x86-64-v2: SSE4.2, SSSE3, POPCNT — supported since Nehalem (2008).
            # Safe baseline for any x86_64 machine from the last ~15 years.
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            pkg_config_path: /opt/homebrew/opt/ffmpeg/lib/pkgconfig
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-intel
            rustflags: "-C target-cpu=x86-64-v2"
            pkg_config_path: /usr/local/opt/ffmpeg/lib/pkgconfig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── System dependencies ─────────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake nasm libclang-dev \
            libopus-dev libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libxft-dev libfontconfig1-dev \
            libpango1.0-dev libcairo2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libswresample-dev \
            libx264-dev libgbm-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install opus ffmpeg pkg-config

      - name: Download and setup prebuilt FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          aws s3 cp s3://baucord/ffmpeg-vcpkg-x64-windows-static-md.zip ffmpeg-vcpkg.zip --endpoint-url https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          7z x ffmpeg-vcpkg.zip -oC:\ffmpeg-prebuilt
          echo "FFMPEG_DIR=C:\ffmpeg-prebuilt\x64-windows-static-md" >> $env:GITHUB_ENV
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # ── Build ───────────────────────────────────────────────────────

      # sccache cannot build ffmpeg-sys-next on Windows: its build script emits
      # ~24KB of --cfg flags, and sccache spawns rustc with the full inline
      # command line, exceeding the 32,767-char CreateProcess limit (os error
      # 206). Cargo avoids this with @argfiles; sccache (verified through
      # v0.17.0, src/compiler/rust.rs generate_compile_commands) does not —
      # it flattens args even when cargo passed an @argfile. So the wrapper is
      # disabled on Windows below; sccache still caches Linux/macOS builds.
      # Note: this action has no `key` input; caches are keyed automatically.
      - name: Setup sccache
        if: runner.os != 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.17.0"

      - name: Build
        env:
          SCCACHE_GHA_ENABLED: ${{ runner.os != 'Windows' && 'true' || 'false' }}
          # Empty string = no wrapper (documented Cargo behavior). Windows must
          # not use sccache — see the comment on the Setup sccache step.
          RUSTC_WRAPPER: ${{ runner.os != 'Windows' && 'sccache' || '' }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path || '' }}
        run: cargo build --profile deploy --target ${{ matrix.target }}

      # ── Package ─────────────────────────────────────────────────────

      - name: Get version
        id: version
        shell: bash
        run: grep '^version' crates/desktop/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | xargs -I{} echo "version={}" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        # The desktop crate pins `[[bin]] name = "baucord"` (the updater
        # and release zips expect that exact name), so cargo's output is
        # `baucord`, not `desktop`.
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/deploy/baucord staging/baucord
          cp target/${{ matrix.target }}/deploy/server staging/dedicated-server
          cd staging
          zip -r ../baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip baucord dedicated-server
      - name: Package (Windows)
        if: runner.os == 'Windows'
        # Same as Unix: the binary is already named baucord.exe.
        run: |
          mkdir staging
          copy target\${{ matrix.target }}\deploy\baucord.exe staging\baucord.exe
          copy target\${{ matrix.target }}\deploy\server.exe staging\dedicated-server.exe
          cd staging
          Compress-Archive -Path baucord.exe,dedicated-server.exe -DestinationPath ..\baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          path: baucord-v${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*.zip
      - name: Prepare release files for R2
        run: |
          VERSION=$(grep '^version' crates/desktop/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          mkdir -p r2-upload
          cp artifacts/*.zip r2-upload/
          echo "$VERSION" > r2-upload/version
      - name: Upload to R2
        uses: jakejarvis/s3-sync-action@v0.5.1
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: r2-upload
