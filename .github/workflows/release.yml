name: Build and Release
on:
  release:
    types: [published]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            # x86-64-v2: SSE4.2, SSSE3, POPCNT — supported since Nehalem (2008).
            # Safe baseline for any x86_64 machine from the last ~15 years.
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
            rustflags: "-C target-cpu=x86-64-v2"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            #rustflags: "-C target-cpu=native"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-intel
            rustflags: "-C target-cpu=x86-64-v2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── System dependencies ─────────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake nasm libclang-dev \
            libopus-dev libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libxft-dev libfontconfig1-dev \
            libpango1.0-dev libcairo2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libswresample-dev \
            libx264-dev libgbm-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install opus ffmpeg pkg-config

      # Windows: vcpkg + FFmpeg static libs
      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-ffmpeg-x264-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-ffmpeg-x264-${{ runner.os }}-

      - name: Export GitHub Actions cache vars
        uses: actions/github-script@v7
        if: runner.os == 'Windows'
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install FFmpeg via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install ffmpeg[x264,gpl]:x64-windows-static-md
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      # ── Build ───────────────────────────────────────────────────────

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          RUSTFLAGS: ${{ matrix.rustflags }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          VCPKG_ROOT: ${{ runner.os == 'Windows' && 'C:\vcpkg' || '' }}
          VCPKGRS_TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows-static-md' || '' }}
        run: cargo build --profile deploy --target ${{ matrix.target }}

      # ── Package ─────────────────────────────────────────────────────

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging/baucord
          cp target/${{ matrix.target }}/deploy/client staging/baucord/baucord
          cp target/${{ matrix.target }}/deploy/server staging/baucord/dedicated-server
          cd staging
          zip -r ../baucord-${{ matrix.suffix }}.zip baucord/
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staging\baucord
          copy target\${{ matrix.target }}\deploy\client.exe staging\baucord\baucord.exe
          copy target\${{ matrix.target }}\deploy\server.exe staging\baucord\dedicated-server.exe
          cd staging
          Compress-Archive -Path baucord -DestinationPath ..\baucord-${{ matrix.suffix }}.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baucord-${{ matrix.suffix }}
          path: baucord-${{ matrix.suffix }}.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*.zip
      - name: Prepare web files
        run: |
          cp artifacts/*.zip web/
          grep '^version' crates/client/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' > web/version
      - name: Upload to R2
        uses: jakejarvis/s3-sync-action@v0.5.1
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: web
