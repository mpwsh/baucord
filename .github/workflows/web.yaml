name: Deploy Website
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docker-compose.yaml"
      - "config/baucord.example.yaml"
      - "scripts/setup.sh"
      - "scripts/monitor-net.sh"
      - "Cargo.lock"
      - "about.toml"
      - "licenses/**"
      - "scripts/licenses.py"
  # After a release's build, so the page names a version whose files
  # are there. "Build and Release" also runs on every push to main, to
  # warm its caches (review P2-50): those runs are not a release and
  # deploy nothing here — the jobs below ask which event started it.
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]

jobs:
  # A release's deploy names its version on the site: only the newest
  # stable release's, never a backport's or a rebuilt older tag's
  # (review 2026-10, P2-27). A push to main always deploys.
  newest:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Is this the newest release?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # A release run's head branch is its tag.
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEWEST=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [ "$TAG" = "$NEWEST" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not the newest stable release ($NEWEST): the site stays"
          fi

  licenses:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/licenses.yml
    with:
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

  deploy:
    needs: [newest, licenses]
    runs-on: ubuntu-latest
    if: needs.newest.outputs.deploy == 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
      - name: Download license files
        uses: actions/download-artifact@v8
        with:
          name: licenses
          path: .
      - name: Stamp version into pages
        run: |
          VERSION=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          sed -i "s/__VERSION__/$VERSION/g" web/index.html web/i18n/*.json
      - name: Stage hosting guide files
        run: |
          set -eu
          mkdir -p web/deploy
          cp docker-compose.yaml scripts/setup.sh scripts/monitor-net.sh web/deploy/
          cp config/baucord.example.yaml web/deploy/baucord.yaml
          python3 - <<'PY'
          import html, pathlib
          page = pathlib.Path("web/deploy.html")
          text = page.read_text(encoding="utf-8")
          if "__COMPOSE__" not in text:
              raise SystemExit("web/deploy.html has no __COMPOSE__ to fill")
          compose = pathlib.Path("docker-compose.yaml").read_text(encoding="utf-8")
          page.write_text(text.replace("__COMPOSE__", html.escape(compose.rstrip("\n"))), encoding="utf-8")
          PY
          ls -la web/deploy
      - name: Upload website to R2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --exclude '*.zip' --exclude '*.apk' --exclude 'version' --exclude 'deploy/*'
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: web
      - name: Upload hosting guide files to R2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --content-type 'text/plain; charset=utf-8'
        env:
          AWS_S3_BUCKET: baucord
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://6bcc35de83e46a771896026baf11b4ac.r2.cloudflarestorage.com
          SOURCE_DIR: web/deploy
          DEST_DIR: deploy
