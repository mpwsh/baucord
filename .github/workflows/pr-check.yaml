name: PR check
# Build + test gate for pull requests (Dependabot's and yours). Two jobs
# so a Dependabot PR gets a fast verdict from the pure-Rust crates while
# the heavy Slint/FFmpeg tier is still compiling.
#
# This is a COMPILE check for the heavy tier, not a release build: it
# uses ubuntu-latest's distro FFmpeg/PipeWire headers and never links a
# shipping binary, so release.yml's ubuntu:22.04 container, static FFmpeg
# and glibc floor are irrelevant here and deliberately not reproduced.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same reason as release.yml: some C deps ship CMakeLists with a
  # too-old cmake_minimum_required.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # ── Tier 1: pure-Rust crates, minutes ──────────────────────────────
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System deps (cpal -> ALSA, opusic-sys -> cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev cmake pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pr-fast
      - name: Check
        # --locked: a PR that changes Cargo.toml without updating
        # Cargo.lock fails here instead of resolving silently.
        # NOTE: `audio --all-targets` stays cheap only once the unused
        # `ui` dev-dependency is removed from audio/Cargo.toml; until
        # then it pulls Slint + skia into this job.
        run: cargo check --locked --all-targets -p protocol -p server -p app-core -p i18n -p audio
      - name: Test
        run: cargo test --locked -p protocol -p server -p app-core -p i18n -p audio

  # ── Tier 2: everything, incl. video/client/desktop/ui ──────────────
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System deps
        # The X11/Wayland/D-Bus/udev list is release.yml's, minus the
        # tools only its from-source FFmpeg/PipeWire builds need
        # (meson, ninja, nasm, zip). FFmpeg and PipeWire headers come
        # from the distro instead:
        #   - libav*-dev: the Linux dev setup video/Cargo.toml documents.
        #   - libpipewire-0.3-dev: VERIFY on first run. release.yml
        #     builds PipeWire 1.0.7 because 22.04's 0.3.48 is too old
        #     for libspa; ubuntu-latest (24.04) ships 1.0.x. If libspa-sys
        #     still complains, lift the "Build PipeWire 1.0.7 headers"
        #     step (and its cache) from release.yml into this job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libpipewire-0.3-dev \
            libasound2-dev libopus-dev \
            libx11-dev libxext-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libxft-dev libfontconfig1-dev \
            libpango1.0-dev libcairo2-dev \
            libgbm-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev \
            libudev-dev \
            libwayland-dev libegl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pr-full
          # Slint/skia dominate; keep the cache even when a later step fails
          # so the next PR doesn't pay for them again.
          cache-on-failure: true
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Check desktop with the release feature set
        run: cargo check --locked -p desktop --features tray
      - name: Test heavy crates
        # video/client/ui unit tests. desktop is a binary crate; its
        # tests, if any, run here too. Add `-p ui` only once ui has tests.
        run: cargo test --locked -p video -p client
