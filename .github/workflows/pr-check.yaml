name: PR check
# The gate for pull requests (Dependabot's and yours), for pushes to
# the default branch, and for every release: formatting, a type-check
# of everything the desktop and the phones share, the lints, and every
# test that needs no display.
#
# It runs in a Debian 13 container with the distro's FFmpeg 7.1 and
# PipeWire, which is the environment these exact commands were last run
# in by hand (PRODUCTION-PLAN §8). It is a check, not a release build:
# release.yml's ubuntu:22.04 container, static FFmpeg and glibc floor
# are not reproduced here. Windows-only code is type-checked by a cross
# check from Linux (`windows`); the phones' apps by `android` and
# `ios`, for their own targets, with the release builds' toolchains but
# nothing linked or packaged; macOS-only desktop code is not compiled
# by this workflow.
#
# The release workflows call it (`workflow_call`) and publish nothing
# until it passed: a tag is never checked by the push and pull-request
# runs, and a push's run is cancelled by the next push, so a tag on a
# commit whose check never finished released untested (review
# 2026-10-27, P1-4). Called, it checks out the caller's commit, or the
# tag the caller was given (`ref`).
on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out (empty = the calling workflow's commit)"
        type: string
        default: ""

# A newer push cancels the run its predecessor started; a release's
# check runs to the end (the group is the caller's name and the tag,
# which nothing else uses).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A dev build's incremental data is of no use to a one-shot runner.
  CARGO_INCREMENTAL: "0"
  # Same reason as release.yml: some C deps ship CMakeLists with a
  # too-old cmake_minimum_required.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # ── Formatting: seconds ────────────────────────────────────────────
  # .rustfmt.toml uses options only the nightly rustfmt has, so this is
  # a nightly's `cargo fmt`, as on a developer's machine. A dated one:
  # a rustfmt that changed overnight failed every open pull request
  # (review 2026-10, P3-59). Move it on purpose, with a format commit.
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-10
          components: rustfmt
      - name: Format check
        run: cargo +nightly-2026-10-10 fmt --all -- --check

  # ── Everything else ────────────────────────────────────────────────
  check:
    runs-on: ubuntu-24.04
    container: debian:13
    defaults:
      run:
        shell: bash # containers default to sh
    steps:
      - name: System dependencies
        # What the workspace's build scripts look for on Linux: FFmpeg
        # (video), ALSA (cpal), PipeWire and XCB (screen capture),
        # X11/Wayland/EGL/GBM/fontconfig (Slint), clang (bindgen),
        # cmake and nasm (bundled C libraries).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates \
            build-essential pkg-config cmake nasm ninja-build python3 \
            clang libclang-dev \
            libasound2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libpipewire-0.3-dev \
            libxcb1-dev libxrandr-dev libx11-dev libxext-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl-dev libgbm-dev \
            libudev-dev libfontconfig1-dev libfreetype-dev

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The toolchain rust-toolchain.toml pins, as in release.yml.
      - name: Read the pinned Rust toolchain
        id: toolchain
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: pr-check
          # Slint and Skia dominate the build: keep the cache even when
          # a later step fails, so the next push does not pay again.
          cache-on-failure: true
          # Pull requests restore the default branch's cache; only its
          # own runs save one.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --locked: a change to a Cargo.toml without its Cargo.lock fails
      # here instead of resolving silently.
      - name: Lints
        # The workspace's default members (every crate but the phone
        # hosts, `android` and `ios`, which build only for their
        # targets), all targets: the type-check, once — a separate
        # `cargo check` ran the same compile again (P3-59). Warnings are
        # reported; only what the workspace denies fails.
        run: cargo clippy --locked --all-targets
      - name: Check the desktop with the release feature set
        run: cargo check --locked -p desktop --features tray
      - name: Check the phones' shared code
        run: cargo check --locked -p frontend --no-default-features

      - name: Tests
        # Every crate whose tests need no display. `--no-fail-fast`: one
        # failing crate does not hide the others' results.
        run: >
          cargo test --locked --no-fail-fast
          -p protocol -p transport -p server -p client
          -p app-core -p audio -p video -p i18n -p keywatch

  # ── The chat pane's scrolling ──────────────────────────────────────
  # The real `ChatPane` driven frame by frame (ANDROID-SPEC D66): the
  # checks the hand-run harness made, on every change (P3-59). Its own
  # workspace and lock file, with Slint's software renderer only.
  chat-scroll-sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - name: Read the pinned Rust toolchain
        id: toolchain
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: chat-scroll-sim
          workspaces: tools/chat-scroll-sim
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the checks
        run: cargo run --locked --manifest-path tools/chat-scroll-sim/Cargo.toml

  # ── The Android app, type-checked for Android ──────────────────────
  # The release build's NDK, SDK platform and cargo-ndk, and its exact
  # environment (android/app/build.gradle.kts, `cargoNdkEnvironment`),
  # running clippy instead of the build: every crate the app links is
  # compiled for aarch64-linux-android, build scripts included (libopus
  # through cmake, Slint's Java helper), and nothing is linked or
  # packaged. 1.5.0's release was the first to find a desktop-only
  # dependency used on the phones; this finds the next one on the pull
  # request that adds it.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK packages
        # The release's: NDK 29, the newest cmake (it brings ninja), and
        # the platform Slint's build script compiles against.
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          LIST=$(sdkmanager --list 2>/dev/null)
          NDK=$(echo "$LIST" | grep -oE 'ndk;29\.[0-9.]+' | sort -V | tail -1)
          BT=$(echo "$LIST"  | grep -oE 'build-tools;36\.[0-9.]+' | sort -V | tail -1)
          CM=$(echo "$LIST"  | grep -oE 'cmake;[0-9.]+' | sort -V | tail -1)
          sdkmanager "platforms;android-36" "$BT" "$NDK" "$CM"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/${CM/;//}/bin" >> "$GITHUB_PATH"
      - name: Read the pinned Rust toolchain
        id: toolchain
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-check
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Type-check and lint for Android
        # `-p android`, as the release builds it: the workspace would
        # unify the desktop's features into frontend.
        env:
          CMAKE_GENERATOR: Ninja
        run: cargo ndk --target arm64-v8a --platform 29 clippy --locked -p android

  # ── The iPhone app, type-checked for iOS ───────────────────────────
  # The release's runner and Xcode (ios-release.yml) and its cargo
  # command (ios/scripts/build_with_cargo.sh), as clippy: every crate
  # the app links compiled for aarch64-apple-ios against the iOS SDK,
  # with nothing linked, signed or archived.
  ios:
    runs-on: macos-26
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      # What the Xcode build hands cargo (ios/project.yml).
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Select Xcode
        run: |
          set -eux
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          cmake --version
      - name: Read the pinned Rust toolchain
        id: toolchain
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-check
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Type-check and lint for iOS
        run: cargo clippy --locked --target aarch64-apple-ios -p ios

  # ── Windows-only code, type-checked from Linux ─────────────────────
  # MinGW's headers stand in for the Windows SDK and Debian's FFmpeg
  # headers for the release's; nothing is linked or run. It catches
  # what does not compile in WASAPI, DXGI, Media Foundation, Raw Input
  # and the rest before a release build on Windows does (T6).
  windows:
    runs-on: ubuntu-24.04
    container: debian:13
    defaults:
      run:
        shell: bash
    steps:
      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates \
            build-essential pkg-config cmake nasm python3 \
            clang libclang-dev \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Read the pinned Rust toolchain
        id: toolchain
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu-check
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: FFmpeg headers for bindgen
        # Only FFmpeg's own folders: the whole multiarch include folder
        # would bring glibc's headers into a Windows build.
        run: |
          set -euo pipefail
          FF="$RUNNER_TEMP/ffmpeg-headers"
          mkdir -p "$FF/include" "$FF/lib"
          for dir in /usr/include/x86_64-linux-gnu/libav* /usr/include/x86_64-linux-gnu/libsw*; do
            ln -s "$dir" "$FF/include/"
          done
          echo "FFMPEG_DIR=$FF" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=/usr/x86_64-w64-mingw32 -I/usr/x86_64-w64-mingw32/include" >> "$GITHUB_ENV"
      - name: Type-check and lint for Windows
        # The frontend is not here: Skia has no prebuilt for windows-gnu.
        run: >
          cargo clippy --locked --target x86_64-pc-windows-gnu
          -p protocol -p transport -p server -p client
          -p app-core -p audio -p video -p keywatch
