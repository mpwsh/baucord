# Builds the server image and pushes it to Docker Hub on release.
# Manual run with a tag rebuilds that release using this branch's Dockerfile;
# without a tag it only builds.
# Needs: variable DOCKERHUB_USER, secret DOCKERHUB_TOKEN.
name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and push (e.g. v1.2.0); empty = build only"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_USER }}/baucord

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PRERELEASE: ${{ github.event.release.prerelease == true }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || '' }}

      - name: Check out Dockerfile from current branch
        if: inputs.tag != ''
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: .ci
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false

      - name: Resolve image tags
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=7 HEAD)
          if [ -z "$TAG" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=" >> "$GITHUB_OUTPUT"
            echo "Build only: ${GITHUB_REF_NAME} (${SHA})"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi
          VERSION="${TAG#v}"
          CRATE=$(awk -F'"' '/^version *=/ { print $2; exit }' Cargo.toml)
          if [ "$CRATE" != "$VERSION" ]; then
            echo "::error::$TAG does not match the version in Cargo.toml ($CRATE)"
            exit 1
          fi
          # `latest` only for the newest release: rebuilding an older
          # tag, or a backport, moved it backwards, and a host pulling
          # it met a database newer than its server and restart-looped
          # (review 2026-10, P2-27).
          NEWEST=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          LATEST=true
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then
            LATEST=false
          elif [ "$TAG" != "$NEWEST" ]; then
            echo "::notice::$TAG is not the newest release ($NEWEST): latest stays where it is"
            LATEST=false
          fi
          {
            echo "push=true"
            echo "tags<<EOF"
            echo "${DOCKERHUB_REPO}:${VERSION}"
            echo "${DOCKERHUB_REPO}:${SHA}"
            if [ "$LATEST" = "true" ]; then echo "${DOCKERHUB_REPO}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built and started here before anything is pushed: a binary the
      # runtime image cannot run (a newer glibc in the builder than in
      # distroless, review 2026-10 P2-28) fails this step, not a host.
      # The cache lives in the registry: a release's GitHub cache is
      # scoped to its tag, and no later run could read it (P2-48).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.tag != '' && '.ci/Dockerfile' || 'Dockerfile' }}
          platforms: linux/amd64
          load: true
          tags: baucord:smoke
          cache-from: type=registry,ref=${{ env.DOCKERHUB_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_REPO }}:buildcache,mode=max

      - name: Start the image once
        run: docker run --rm baucord:smoke --help

      - name: Push image
        if: steps.plan.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.tag != '' && '.ci/Dockerfile' || 'Dockerfile' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_REPO }}:buildcache
