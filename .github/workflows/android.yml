# Builds the Android debug APK (ANDROID-SPEC.md §11) so a phone can be
# tested from a download rather than a Windows toolchain. First real
# run pending as of 2026-10-05 (the first attempt died in GitHub's
# runner allocation before any step ran).
name: android

on:
  workflow_dispatch:
    inputs:
      features:
        description: "Cargo features for the android crate (empty = the app; hello = M0 smoke test)"
        default: ""
  push:
    paths:
      - "crates/**"
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "crates/**"
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"

jobs:
  apk:
    # Pinned: `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19; a build
    # this toolchain-heavy should change images on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # arm64 only in CI: the x86_64 emulator image is a local concern.
      CARGO_TARGETS: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      # The JDK Gradle 8 and Slint's build.rs (javac + d8) need. 17 or
      # 21 — never 25 (Gradle 8.14 runs on 17–24, spec §3).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # cmdline-tools + sdkmanager on PATH, ANDROID_HOME/ANDROID_SDK_ROOT
      # exported, licences accepted. The packages themselves next.
      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          LIST=$(sdkmanager --list 2>/dev/null)
          # Newest of each: NDK r29, Build-Tools 36 (plus 35.0.0, AGP
          # 8.13's own default), the SDK's cmake (brings ninja).
          NDK=$(echo "$LIST" | grep -oE 'ndk;29\.[0-9.]+' | sort -V | tail -1)
          BT=$(echo "$LIST"  | grep -oE 'build-tools;36\.[0-9.]+' | sort -V | tail -1)
          CM=$(echo "$LIST"  | grep -oE 'cmake;[0-9.]+' | sort -V | tail -1)
          echo "ndk=$NDK build-tools=$BT cmake=$CM"
          sdkmanager "platforms;android-36" "$BT" "build-tools;35.0.0" "$NDK" "$CM" "platform-tools"
          NDK_DIR="$ANDROID_HOME/ndk/${NDK#ndk;}"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          # skia-bindings reads this name, only if it ever builds Skia
          # from source instead of downloading the prebuilt.
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/${CM/;//}/bin" >> "$GITHUB_PATH"

      # The repo's rust-toolchain.toml picks the Rust version; only the
      # Android target is added to it.
      - name: Rust toolchain + target
        run: |
          set -eux
          rustup toolchain install
          rustup target add aarch64-linux-android
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.CARGO_TARGETS }}

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the debug APK
        working-directory: android
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          set -eux
          # Git on Windows commits scripts without the executable bit.
          chmod +x gradlew
          cargo ndk --version
          ./gradlew --no-daemon assembleDebug \
            -PcargoTargets="$CARGO_TARGETS" \
            -PcargoFeatures="${{ github.event.inputs.features }}"

      - name: 16 KB page-size check (spec §11)
        run: |
          set -eux
          SO=android/app/src/main/jniLibs/arm64-v8a/libbaucord_android.so
          READELF="$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          "$READELF" -l "$SO" | grep LOAD
          # Every LOAD segment's alignment column must read 0x4000.
          if "$READELF" -l "$SO" | grep LOAD | grep -v 0x4000; then
            echo "a LOAD segment is not 16 KB aligned"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: baucord-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
